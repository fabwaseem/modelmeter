name: Build and publish ModelMeter test release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelmeter-test-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate branded package images
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out = Path("ModelMeter (Package)/Images")
          out.mkdir(parents=True, exist_ok=True)
          sizes = {"AppIcon.png":(44,44), "StoreLogo.png":(50,50), "SmallTile.png":(71,71),
                   "MediumTile.png":(150,150), "WideTile.png":(310,150),
                   "LargeTile.png":(310,310), "SplashScreen.png":(620,300)}
          for name, (w,h) in sizes.items():
              im = Image.new("RGBA", (w,h), (16,17,19,255))
              d = ImageDraw.Draw(im)
              scale = min(w,h)/150
              cx, cy = (int(h*.52), h//2) if w/h > 1.5 else (w//2,h//2)
              radius = int(min(w,h)*.31)
              width = max(2,int(7*scale))
              d.arc((cx-radius,cy-radius,cx+radius,cy+radius),135,405,fill=(163,230,53,255),width=width)
              import math
              ex = cx + int(radius*.48)
              ey = cy - int(radius*.42)
              d.line((cx,cy,ex,ey),fill=(163,230,53,255),width=max(2,int(5*scale)))
              dot = max(2,int(4*scale))
              d.ellipse((cx-dot,cy-dot,cx+dot,cy+dot),fill=(163,230,53,255))
              if w/h > 1.5:
                  try: font = ImageFont.truetype("arialbd.ttf", max(14,int(h*.14)))
                  except: font = ImageFont.load_default()
                  d.text((int(h*1.05),int(h*.36)),"MODELMETER",font=font,fill=(245,245,245,255))
              im.save(out/name)
          '@ | Set-Content -Path "$env:RUNNER_TEMP\make_assets.py"
          python "$env:RUNNER_TEMP\make_assets.py"

      - name: Create test signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=ModelMeter-Test" -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(2) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = ConvertTo-SecureString "ModelMeter-Test-Only-2026" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ModelMeter-Test.pfx" -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\ModelMeter-Test.cer" | Out-Null
          "CERT_PATH=$env:RUNNER_TEMP\ModelMeter-Test.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed MSIX bundle
        shell: pwsh
        run: |
          msbuild "ModelMeter (Package)/ModelMeter (Package).wapproj" /restore /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$env:CERT_PATH" /p:PackageCertificatePassword="ModelMeter-Test-Only-2026" /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundle = Get-ChildItem -Path "ModelMeter (Package)" -Filter "*.msixbundle" -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "MSIX bundle was not produced." }
          Copy-Item $bundle.FullName "dist/ModelMeter-0.1.0-beta.1.msixbundle"
          Copy-Item "ModelMeter-Test.cer" "dist/ModelMeter-Test.cer"
          Copy-Item "release/install.ps1" "dist/install.ps1"

      - name: Publish GitHub test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-beta.1
          name: ModelMeter 0.1.0 Beta 1
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            dist/ModelMeter-0.1.0-beta.1.msixbundle
            dist/ModelMeter-Test.cer
            dist/install.ps1
