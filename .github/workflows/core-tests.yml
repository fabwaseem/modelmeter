name: Core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/ModelMeter.Core.Tests/ModelMeter.Core.Tests.csproj
      - run: dotnet test tests/ModelMeter.Core.Tests/ModelMeter.Core.Tests.csproj --configuration Release --no-restore
