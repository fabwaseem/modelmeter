name: Windows build and core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: modelmeter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build WidBar widget
        run: dotnet build ModelMeter.ExtensionApp/ModelMeter.ExtensionApp.csproj --configuration Release -p:Platform=x64
      - name: Run core tests
        run: dotnet test tests/ModelMeter.Core.Tests/ModelMeter.Core.Tests.csproj --configuration Release
